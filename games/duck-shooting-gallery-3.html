<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duck Shooting Gallery</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #1a0a2e;
  font-family: 'Arial Black', sans-serif;
  overflow: hidden;
  width: 380px;
  height: 500px;
}

#game-container {
  position: relative;
  width: 380px;
  height: 500px;
  background: linear-gradient(180deg, #1a0a2e 0%, #2d1b4e 50%, #3d2963 100%);
  overflow: hidden;
  cursor: crosshair;
}

#start-screen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(26, 10, 46, 0.95);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

#start-screen h1 {
  color: #ffbe0b;
  font-size: 32px;
  text-shadow: 0 0 10px #ff006e, 0 0 20px #ff006e;
  margin-bottom: 20px;
  text-align: center;
}

#start-screen p {
  color: #00f5d4;
  font-size: 14px;
  margin-bottom: 30px;
  text-align: center;
  padding: 0 20px;
}

#play-btn {
  background: linear-gradient(45deg, #ff006e, #8338ec);
  color: white;
  border: none;
  padding: 15px 40px;
  font-size: 24px;
  font-weight: bold;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 0 20px #ff006e;
  transition: transform 0.2s;
}

#play-btn:hover {
  transform: scale(1.1);
}

#hud {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  justify-content: space-between;
  z-index: 100;
}

.hud-item {
  background: rgba(0, 0, 0, 0.7);
  padding: 8px 15px;
  border-radius: 20px;
  color: #ffbe0b;
  font-size: 18px;
  font-weight: bold;
  text-shadow: 0 0 5px #ff006e;
  border: 2px solid #ff006e;
}

#canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.crosshair {
  position: absolute;
  width: 30px;
  height: 30px;
  pointer-events: none;
  z-index: 50;
}

.crosshair::before,
.crosshair::after {
  content: '';
  position: absolute;
  background: #ff006e;
  box-shadow: 0 0 5px #ff006e;
}

.crosshair::before {
  width: 2px;
  height: 30px;
  left: 14px;
}

.crosshair::after {
  width: 30px;
  height: 2px;
  top: 14px;
}

.particle {
  position: absolute;
  pointer-events: none;
  z-index: 99;
}

.hidden {
  display: none !important;
}

#game-over {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0, 0, 0, 0.9);
  padding: 30px;
  border-radius: 20px;
  border: 3px solid #ffbe0b;
  text-align: center;
  z-index: 1001;
}

#game-over h2 {
  color: #ff006e;
  font-size: 28px;
  margin-bottom: 15px;
  text-shadow: 0 0 10px #ff006e;
}

#game-over p {
  color: #00f5d4;
  font-size: 20px;
  margin-bottom: 20px;
}

#final-score {
  color: #ffbe0b;
  font-size: 36px;
  font-weight: bold;
  text-shadow: 0 0 10px #ffbe0b;
}
</style>
</head>
<body>
<div id="game-container">
  <div id="start-screen">
    <h1>🦆 DUCK SHOOTING<br>GALLERY 🎯</h1>
    <p>Shoot the ducks! Golden ducks are worth bonus points!</p>
    <button id="play-btn">Play!</button>
  </div>
  
  <div id="hud" class="hidden">
    <div class="hud-item">Score: <span id="score">0</span></div>
    <div class="hud-item">Time: <span id="timer">30</span></div>
  </div>
  
  <canvas id="canvas"></canvas>
  
  <div id="game-over" class="hidden">
    <h2>GAME OVER!</h2>
    <p>Final Score:</p>
    <div id="final-score">0</div>
  </div>
</div>

<script>
(function() {
  'use strict';
  
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const startScreen = document.getElementById('start-screen');
  const hud = document.getElementById('hud');
  const scoreEl = document.getElementById('score');
  const timerEl = document.getElementById('timer');
  const gameOverEl = document.getElementById('game-over');
  const finalScoreEl = document.getElementById('final-score');
  const playBtn = document.getElementById('play-btn');
  
  canvas.width = 380;
  canvas.height = 500;
  
  let gameActive = false;
  let score = 0;
  let timeLeft = 30;
  let ducks = [];
  let particles = [];
  let animationId;
  let timerInterval;
  let shake = { x: 0, y: 0, intensity: 0 };
  
  class Duck {
    constructor(row) {
      this.row = row;
      this.y = 100 + row * 80;
      this.size = 40;
      this.speed = 1 + Math.random() * 1.5 + row * 0.3;
      this.direction = Math.random() > 0.5 ? 1 : -1;
      this.x = this.direction > 0 ? -this.size : canvas.width + this.size;
      this.wobble = 0;
      this.wobbleSpeed = 0.1 + Math.random() * 0.05;
      this.alive = true;
      this.isGolden = Math.random() < 0.15;
      this.baseY = this.y;
    }
    
    update() {
      this.x += this.speed * this.direction;
      this.wobble += this.wobbleSpeed;
      this.y = this.baseY + Math.sin(this.wobble) * 5;
      
      if (this.direction > 0 && this.x > canvas.width + this.size) {
        return false;
      }
      if (this.direction < 0 && this.x < -this.size) {
        return false;
      }
      return true;
    }
    
    draw() {
      if (!this.alive) return;
      
      ctx.save();
      ctx.translate(this.x, this.y);
      
      if (this.direction < 0) {
        ctx.scale(-1, 1);
      }
      
      const tilt = Math.sin(this.wobble) * 10;
      ctx.rotate(tilt * Math.PI / 180);
      
      // Body
      ctx.fillStyle = this.isGolden ? '#ffbe0b' : '#ffbe0b';
      if (this.isGolden) {
        ctx.shadowColor = '#ffbe0b';
        ctx.shadowBlur = 15;
      }
      ctx.beginPath();
      ctx.ellipse(0, 0, this.size * 0.6, this.size * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      
      // Head
      ctx.fillStyle = this.isGolden ? '#ffd000' : '#ffbe0b';
      ctx.beginPath();
      ctx.arc(-this.size * 0.4, -this.size * 0.3, this.size * 0.35, 0, Math.PI * 2);
      ctx.fill();
      
      // Beak
      ctx.fillStyle = '#fb5607';
      ctx.beginPath();
      ctx.moveTo(-this.size * 0.7, -this.size * 0.3);
      ctx.lineTo(-this.size * 0.9, -this.size * 0.25);
      ctx.lineTo(-this.size * 0.7, -this.size * 0.2);
      ctx.closePath();
      ctx.fill();
      
      // Eye
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-this.size * 0.5, -this.size * 0.35, this.size * 0.08, 0, Math.PI * 2);
      ctx.fill();
      
      // Wing detail
      ctx.strokeStyle = this.isGolden ? '#ff006e' : '#fb5607';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.size * 0.1, 0, this.size * 0.3, Math.PI * 0.2, Math.PI * 0.8);
      ctx.stroke();
      
      ctx.restore();
    }
    
    isHit(mx, my) {
      const dx = mx - this.x;
      const dy = my - this.y;
      return Math.sqrt(dx * dx + dy * dy) < this.size * 0.7;
    }
  }
  
  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.vx = (Math.random() - 0.5) * 8;
      this.vy = (Math.random() - 0.5) * 8 - 2;
      this.life = 1;
      this.decay = 0.02;
      this.size = Math.random() * 6 + 2;
      this.color = color;
      this.rotation = Math.random() * Math.PI * 2;
      this.rotationSpeed = (Math.random() - 0.5) * 0.3;
    }
    
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += 0.3;
      this.life -= this.decay;
      this.rotation += this.rotationSpeed;
      return this.life > 0;
    }
    
    draw() {
      ctx.save();
      ctx.globalAlpha = this.life;
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);
      ctx.fillStyle = this.color;
      ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
      ctx.restore();
    }
  }
  
  function createSplash(x, y, isGolden) {
    const colors = isGolden 
      ? ['#ffbe0b', '#ffd000', '#ff006e', '#00f5d4']
      : ['#00f5d4', '#8338ec', '#ffbe0b', '#ffffff'];
    
    for (let i = 0; i < 20; i++) {
      particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
    }
    
    shake.intensity = isGolden ? 8 : 4;
  }
  
  function spawnDuck() {
    const row = Math.floor(Math.random() * 4);
    ducks.push(new Duck(row));
  }
  
  function updateScore(points) {
    score += points;
    scoreEl.textContent = score;
    
    window.parent.postMessage({
      type: 'game:score',
      gameId: 'duck-shooting-gallery-3',
      score: score
    }, '*');
  }
  
  function handleClick(e) {
    if (!gameActive) return;
    
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    
    let hit = false;
    for (let i = ducks.length - 1; i >= 0; i--) {
      if (ducks[i].alive && ducks[i].isHit(mx, my)) {
        ducks[i].alive = false;
        const points = ducks[i].isGolden ? 50 : 10;
        updateScore(points);
        createSplash(ducks[i].x, ducks[i].y, ducks[i].isGolden);
        hit = true;
        setTimeout(() => ducks.splice(i, 1), 100);
        break;
      }
    }
    
    if (!hit) {
      shake.intensity = 2;
    }
  }
  
  function updateShake() {
    if (shake.intensity > 0) {
      shake.x = (Math.random() - 0.5) * shake.intensity;
      shake.y = (Math.random() - 0.5) * shake.intensity;
      shake.intensity *= 0.9;
      if (shake.intensity < 0.1) {
        shake.intensity = 0;
        shake.x = 0;
        shake.y = 0;
      }
    }
  }
  
  function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    ctx.translate(shake.x, shake.y);
    
    // Draw water rows
    for (let i = 0; i < 4; i++) {
      const y = 100 + i * 80;
      ctx.fillStyle = `rgba(0, 245, 212, ${0.1 + i * 0.05})`;
      ctx.fillRect(0, y - 20, canvas.width, 60);
    }
    
    // Update and draw ducks
    for (let i = ducks.length - 1; i >= 0; i--) {
      if (!ducks[i].update()) {
        ducks.splice(i, 1);
      } else {
        ducks[i].draw();
      }
    }
    
    // Update and draw particles
    for (let i = particles.length - 1; i >= 0; i--) {
      if (!particles[i].update()) {
        particles.splice(i, 1);
      } else {
        particles[i].draw();
      }
    }
    
    ctx.restore();
    
    updateShake();
    
    // Spawn ducks
    if (Math.random() < 0.02 && ducks.length < 8) {
      spawnDuck();
    }
    
    if (gameActive) {
      animationId = requestAnimationFrame(gameLoop);
    }
  }
  
  function startGame() {
    startScreen.classList.add('hidden');
    hud.classList.remove('hidden');
    gameOverEl.classList.add('hidden');
    
    score = 0;
    timeLeft = 30;
    ducks = [];
    particles = [];
    scoreEl.textContent = '0';
    timerEl.textContent = '30';
    gameActive = true;
    
    // Spawn initial ducks
    for (let i = 0; i < 4; i++) {
      setTimeout(() => spawnDuck(), i * 500);
    }
    
    timerInterval = setInterval(() => {
      timeLeft--;
      timerEl.textContent = timeLeft;
      
      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);
    
    gameLoop();
  }
  
  function endGame() {
    gameActive = false;
    clearInterval(timerInterval);
    cancelAnimationFrame(animationId);
    
    finalScoreEl.textContent = score;
    gameOverEl.classList.remove('hidden');
    
    window.parent.postMessage({
      type: 'game:complete',
      gameId: 'duck-shooting-gallery-3',
      score: score
    }, '*');
    
    setTimeout(() => {
      gameOverEl.classList.add('hidden');
      startScreen.classList.remove('hidden');
      hud.classList.add('hidden');
    }, 3000);
  }
  
  playBtn.addEventListener('click', startGame);
  canvas.addEventListener('click', handleClick);
  
  // Draw background elements
  ctx.fillStyle = '#1a0a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Draw carnival stripes
  for (let i = 0; i < 10; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#ff006e' : '#8338ec';
    ctx.globalAlpha = 0.1;
    ctx.fillRect(0, i * 50, canvas.width, 25);
  }
  ctx.globalAlpha = 1;
})();
</script>
</body>
</html>
