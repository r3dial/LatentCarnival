<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldfish Scoop</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #1a0a2e;
  font-family: 'Comic Sans MS', cursive, sans-serif;
  overflow: hidden;
  width: 380px;
  height: 500px;
}

#game-container {
  width: 380px;
  height: 500px;
  position: relative;
  background: linear-gradient(180deg, #1a0a2e 0%, #2d1b4e 100%);
}

#title {
  text-align: center;
  padding: 15px;
  font-size: 28px;
  color: #ffbe0b;
  text-shadow: 0 0 10px #ff006e, 0 0 20px #ff006e;
  font-weight: bold;
}

#pond {
  position: absolute;
  top: 80px;
  left: 20px;
  width: 340px;
  height: 320px;
  background: radial-gradient(circle at 50% 30%, #00a8cc, #005f73, #003d4d);
  border-radius: 50% 50% 45% 45%;
  border: 4px solid #00f5d4;
  box-shadow: 0 0 20px rgba(0, 245, 212, 0.3), inset 0 0 50px rgba(0, 0, 0, 0.3);
  overflow: hidden;
}

#score-display {
  position: absolute;
  top: 420px;
  left: 20px;
  color: #ffbe0b;
  font-size: 20px;
  text-shadow: 0 0 5px #ff006e;
  font-weight: bold;
}

#timer-display {
  position: absolute;
  top: 420px;
  right: 20px;
  color: #00f5d4;
  font-size: 20px;
  text-shadow: 0 0 5px #8338ec;
  font-weight: bold;
}

#net-health {
  position: absolute;
  top: 450px;
  left: 20px;
  width: 340px;
  height: 20px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 10px;
  border: 2px solid #00f5d4;
  overflow: hidden;
}

#net-health-bar {
  height: 100%;
  background: linear-gradient(90deg, #fb5607, #ffbe0b);
  transition: width 0.3s;
  box-shadow: 0 0 10px #ffbe0b;
}

#play-button {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 20px 50px;
  font-size: 32px;
  background: linear-gradient(135deg, #ff006e, #8338ec);
  color: white;
  border: 4px solid #ffbe0b;
  border-radius: 15px;
  cursor: pointer;
  font-weight: bold;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
  box-shadow: 0 0 20px rgba(255, 0, 110, 0.5);
  z-index: 1000;
}

#play-button:hover {
  transform: translate(-50%, -50%) scale(1.1);
  box-shadow: 0 0 30px rgba(255, 0, 110, 0.8);
}

.fish {
  position: absolute;
  width: 40px;
  height: 30px;
  transition: transform 0.1s;
  cursor: pointer;
}

.net {
  position: absolute;
  width: 60px;
  height: 60px;
  pointer-events: none;
  z-index: 100;
}

.net-circle {
  width: 100%;
  height: 100%;
  border: 3px solid #8338ec;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 190, 11, 0.3), transparent);
  position: relative;
}

.net-handle {
  position: absolute;
  bottom: -30px;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 35px;
  background: #fb5607;
}

.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 200;
}

.splash {
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid rgba(0, 245, 212, 0.6);
  pointer-events: none;
  animation: splash 0.5s ease-out forwards;
}

@keyframes splash {
  from {
    transform: scale(0);
    opacity: 1;
  }
  to {
    transform: scale(3);
    opacity: 0;
  }
}

.score-popup {
  position: absolute;
  color: #ffbe0b;
  font-size: 24px;
  font-weight: bold;
  text-shadow: 0 0 10px #ff006e;
  pointer-events: none;
  z-index: 300;
  animation: floatUp 1s ease-out forwards;
}

@keyframes floatUp {
  from {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  to {
    transform: translateY(-50px) scale(1.5);
    opacity: 0;
  }
}

#game-over {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(26, 10, 46, 0.95);
  border: 4px solid #00f5d4;
  border-radius: 20px;
  padding: 30px;
  text-align: center;
  z-index: 2000;
  box-shadow: 0 0 30px rgba(0, 245, 212, 0.5);
  display: none;
}

#game-over h2 {
  color: #ffbe0b;
  font-size: 32px;
  margin-bottom: 15px;
  text-shadow: 0 0 10px #ff006e;
}

#game-over p {
  color: #00f5d4;
  font-size: 24px;
  margin-bottom: 20px;
}

</style>
</head>
<body>

<div id="game-container">
  <div id="title">🐠 Goldfish Scoop! 🐠</div>
  
  <div id="pond"></div>
  
  <div id="score-display" style="display:none;">Score: <span id="score">0</span></div>
  <div id="timer-display" style="display:none;">Time: <span id="timer">30</span>s</div>
  <div id="net-health" style="display:none;">
    <div id="net-health-bar" style="width: 100%;"></div>
  </div>
  
  <button id="play-button">Play!</button>
  
  <div id="game-over">
    <h2>Time's Up!</h2>
    <p>Final Score: <span id="final-score">0</span></p>
  </div>
</div>

<script>
(function() {
  'use strict';
  
  const gameId = 'goldfish-scoop-19';
  const pond = document.getElementById('pond');
  const playButton = document.getElementById('play-button');
  const scoreDisplay = document.getElementById('score-display');
  const timerDisplay = document.getElementById('timer-display');
  const scoreSpan = document.getElementById('score');
  const timerSpan = document.getElementById('timer');
  const netHealthBar = document.getElementById('net-health-bar');
  const netHealthContainer = document.getElementById('net-health');
  const gameOverDiv = document.getElementById('game-over');
  const finalScoreSpan = document.getElementById('final-score');
  
  let score = 0;
  let gameActive = false;
  let netHealth = 100;
  let timeLeft = 30;
  let fish = [];
  let net = null;
  let gameInterval = null;
  let netDamageInterval = null;
  
  const fishTypes = [
    { color: '#ff006e', points: 5, speed: 2, size: 1 },      // Pink - common
    { color: '#ffbe0b', points: 10, speed: 2.5, size: 1 },   // Gold - uncommon
    { color: '#00f5d4', points: 15, speed: 3, size: 0.9 },   // Cyan - rare
    { color: '#8338ec', points: 25, speed: 3.5, size: 0.8 }, // Purple - epic
    { color: '#fb5607', points: 50, speed: 4.5, size: 0.7 }  // Orange - legendary
  ];
  
  function createNet() {
    net = document.createElement('div');
    net.className = 'net';
    net.innerHTML = '<div class="net-circle"></div><div class="net-handle"></div>';
    net.style.display = 'none';
    pond.appendChild(net);
  }
  
  function createFish() {
    const fishDiv = document.createElement('div');
    fishDiv.className = 'fish';
    
    const rand = Math.random();
    let type;
    if (rand < 0.4) type = fishTypes[0];
    else if (rand < 0.7) type = fishTypes[1];
    else if (rand < 0.85) type = fishTypes[2];
    else if (rand < 0.95) type = fishTypes[3];
    else type = fishTypes[4];
    
    const x = Math.random() * 280;
    const y = Math.random() * 260;
    const angle = Math.random() * Math.PI * 2;
    
    fishDiv.style.left = x + 'px';
    fishDiv.style.top = y + 'px';
    fishDiv.style.transform = `scale(${type.size})`;
    
    fishDiv.innerHTML = `
      <svg viewBox="0 0 40 30" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="25" cy="15" rx="12" ry="8" fill="${type.color}"/>
        <circle cx="28" cy="12" r="2" fill="white"/>
        <circle cx="29" cy="11.5" r="1" fill="black"/>
        <path d="M 10 15 L 0 8 L 5 15 L 0 22 Z" fill="${type.color}" opacity="0.8"/>
        <path d="M 30 8 L 35 5 L 32 10 Z" fill="${type.color}" opacity="0.7"/>
        <path d="M 30 22 L 35 25 L 32 20 Z" fill="${type.color}" opacity="0.7"/>
      </svg>
    `;
    
    pond.appendChild(fishDiv);
    
    const fishObj = {
      element: fishDiv,
      x: x,
      y: y,
      angle: angle,
      speed: type.speed,
      type: type,
      vx: Math.cos(angle) * type.speed,
      vy: Math.sin(angle) * type.speed
    };
    
    fish.push(fishObj);
    
    fishDiv.addEventListener('click', function(e) {
      if (!gameActive) return;
      catchFish(fishObj, e);
    });
  }
  
  function catchFish(fishObj, event) {
    if (netHealth <= 0) return;
    
    const points = fishObj.type.points;
    score += points;
    scoreSpan.textContent = score;
    
    window.parent.postMessage({
      type: 'game:score',
      gameId: gameId,
      score: score
    }, '*');
    
    createSplash(fishObj.x + 20, fishObj.y + 15);
    createScorePopup(points, fishObj.x + 20, fishObj.y + 15);
    createParticles(fishObj.x + 20, fishObj.y + 15, fishObj.type.color);
    
    fishObj.element.remove();
    fish = fish.filter(f => f !== fishObj);
    
    netHealth = Math.max(0, netHealth - 8);
    netHealthBar.style.width = netHealth + '%';
    
    if (netHealth <= 0) {
      endGame();
    } else {
      setTimeout(createFish, 300);
    }
  }
  
  function createSplash(x, y) {
    const splash = document.createElement('div');
    splash.className = 'splash';
    splash.style.left = (x - 10) + 'px';
    splash.style.top = (y - 10) + 'px';
    pond.appendChild(splash);
    setTimeout(() => splash.remove(), 500);
  }
  
  function createScorePopup(points, x, y) {
    const popup = document.createElement('div');
    popup.className = 'score-popup';
    popup.textContent = '+' + points;
    popup.style.left = x + 'px';
    popup.style.top = y + 'px';
    pond.appendChild(popup);
    setTimeout(() => popup.remove(), 1000);
  }
  
  function createParticles(x, y, color) {
    for (let i = 0; i < 8; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = x + 'px';
      particle.style.top = y + 'px';
      particle.style.background = color;
      pond.appendChild(particle);
      
      const angle = (Math.PI * 2 * i) / 8;
      const speed = 2 + Math.random() * 2;
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;
      
      let px = x;
      let py = y;
      let life = 20;
      
      const animate = () => {
        px += vx;
        py += vy;
        life--;
        particle.style.left = px + 'px';
        particle.style.top = py + 'px';
        particle.style.opacity = life / 20;
        
        if (life > 0) {
          requestAnimationFrame(animate);
        } else {
          particle.remove();
        }
      };
      
      animate();
    }
  }
  
  function updateFish() {
    fish.forEach(fishObj => {
      fishObj.x += fishObj.vx;
      fishObj.y += fishObj.vy;
      
      if (fishObj.x < 0 || fishObj.x > 300) {
        fishObj.vx *= -1;
        fishObj.angle = Math.atan2(fishObj.vy, fishObj.vx);
      }
      if (fishObj.y < 0 || fishObj.y > 280) {
        fishObj.vy *= -1;
        fishObj.angle = Math.atan2(fishObj.vy, fishObj.vx);
      }
      
      fishObj.x = Math.max(0, Math.min(300, fishObj.x));
      fishObj.y = Math.max(0, Math.min(280, fishObj.y));
      
      fishObj.element.style.left = fishObj.x + 'px';
      fishObj.element.style.top = fishObj.y + 'px';
      
      const flip = fishObj.vx < 0 ? 'scaleX(-1)' : 'scaleX(1)';
      fishObj.element.style.transform = `${flip} scale(${fishObj.type.size})`;
    });
  }
  
  function startGame() {
    score = 0;
    netHealth = 100;
    timeLeft = 30;
    fish = [];
    gameActive = true;
    
    scoreSpan.textContent = score;
    timerSpan.textContent = timeLeft;
    netHealthBar.style.width = '100%';
    
    playButton.style.display = 'none';
    scoreDisplay.style.display = 'block';
    timerDisplay.style.display = 'block';
    netHealthContainer.style.display = 'block';
    gameOverDiv.style.display = 'none';
    
    pond.innerHTML = '';
    createNet();
    
    for (let i = 0; i < 6; i++) {
      createFish();
    }
    
    gameInterval = setInterval(() => {
      updateFish();
      
      timeLeft--;
      timerSpan.textContent = timeLeft;
      
      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);
    
    netDamageInterval = setInterval(() => {
      if (gameActive) {
        netHealth = Math.max(0, netHealth - 1);
        netHealthBar.style.width = netHealth + '%';
        
        if (netHealth <= 0) {
          endGame();
        }
      }
    }, 200);
    
    const updateLoop = () => {
      if (gameActive) {
        updateFish();
        requestAnimationFrame(updateLoop);
      }
    };
    updateLoop();
  }
  
  function endGame() {
    gameActive = false;
    clearInterval(gameInterval);
    clearInterval(netDamageInterval);
    
    window.parent.postMessage({
      type: 'game:complete',
      gameId: gameId,
      score: score
    }, '*');
    
    finalScoreSpan.textContent = score;
    gameOverDiv.style.display = 'block';
    
    setTimeout(() => {
      gameOverDiv.style.display = 'none';
      playButton.style.display = 'block';
      scoreDisplay.style.display = 'none';
      timerDisplay.style.display = 'none';
      netHealthContainer.style.display = 'none';
      pond.innerHTML = '';
    }, 3000);
  }
  
  pond.addEventListener('mousemove', (e) => {
    if (!gameActive) return;
    const rect = pond.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    net.style.left = (x - 30) + 'px';
    net.style.top = (y - 30) + 'px';
    net.style.display = 'block';
  });
  
  pond.addEventListener('mouseleave', () => {
    if (net) net.style.display = 'none';
  });
  
  playButton.addEventListener('click', startGame);
  
})();
</script>

</body>
</html>
