<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latent Carnival</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎪</text></svg>">
</head>
<body>
  <div id="stars"></div>

  <header id="arch">
    <div class="arch-lights"></div>
    <h1 class="neon-title">LATENT CARNIVAL</h1>
    <p class="subtitle">Where the hidden dimensions come out to play</p>
    <div class="arch-lights"></div>
  </header>

  <nav id="scroll-nav">
    <button id="scroll-left" class="nav-arrow" aria-label="Scroll left">&#9664;</button>
    <button id="scroll-right" class="nav-arrow" aria-label="Scroll right">&#9654;</button>
  </nav>

  <div id="road-container">
    <div id="string-lights"></div>
    <div id="road"></div>
  </div>

  <div id="ground"></div>

  <footer id="footer">
    <p>
      <a href="https://github.com/r3dial/LatentCarnival/issues/new" target="_blank" rel="noopener">Submit a game idea</a>
      &middot;
      <a href="https://github.com/r3dial/LatentCarnival" target="_blank" rel="noopener">GitHub</a>
    </p>
  </footer>

  <script src="road.js"></script>
</body>
</html>
